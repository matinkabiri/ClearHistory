name: Publish Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish ClearHistory.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - name: Select release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -eq 'refs/heads/main' -or ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $tag -eq 'main')) {
            $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No release tag was found.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path dist\ClearHistory.exe -DestinationPath ClearHistory-${{ steps.release.outputs.tag }}-win-x64.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No release tag was found.' }
          $asset = "ClearHistory-$tag-win-x64.zip"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and -not (gh release view $tag 2>$null)) {
            gh release create $tag $asset --title "ClearHistory $tag" --notes-file RELEASE_NOTES.md
          } else {
            gh release upload $tag $asset --clobber
          }
